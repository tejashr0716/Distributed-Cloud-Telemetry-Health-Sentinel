name: CloudSentinel CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: cloudsentinel_db
      POSTGRES_USER: runner
      POSTGRES_PASSWORD: password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      RABBITMQ_HOST: 127.0.0.1
      BASE_URL: http://127.0.0.1:8011
      SECOND_BASE_URL: http://127.0.0.1:8012
      TEST_DATABASE_URL: postgresql://runner:password@127.0.0.1:5432/cloudsentinel_db
      PYTHONPATH: .

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cloudsentinel_db
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Clang & Build Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake

      - name: Compile scalar C++ health core
        run: |
          clang++ -O3 -fPIC -shared -std=c++17 -I./include src/cloudsentinel.cpp -pthread -o libcloudsentinel.so

      - name: Run C++ Native Benchmarks
        run: |
          clang++ -O3 -std=c++17 -I./include benchmarks/bench_engine.cpp -L. -lcloudsentinel -Wl,-rpath,. -o bench_engine
          ./bench_engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Java for Spark
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize PostgreSQL Schema
        run: |
          PGPASSWORD=password psql -h localhost -U runner -d cloudsentinel_db -f sql/schema.sql

      - name: Start local HTTP gateway
        run: |
          uvicorn python.api.main:app --host 127.0.0.1 --port 8011 > /tmp/gateway.log 2>&1 &
          python - <<'WAIT'
          import os, time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen(os.environ['BASE_URL'] + '/health',timeout=2)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Gateway failed to start')
          WAIT
      - name: Execute native, database and real HTTP tests
        run: pytest -v python/tests tests --junitxml=reports/ci-tests.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: reports/ci-tests.xml
