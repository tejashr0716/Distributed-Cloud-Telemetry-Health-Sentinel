
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudsentinel_db
      POSTGRES_USER: cloudsentinel_user
      POSTGRES_PASSWORD: cloudsentinel_secret
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5541}:5432"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudsentinel_user -d cloudsentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6381}:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5674}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15674}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  sentinel-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8001}:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: cloudsentinel_db
      POSTGRES_USER: cloudsentinel_user
      POSTGRES_PASSWORD: cloudsentinel_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 3
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672

volumes:
  pgdata:
